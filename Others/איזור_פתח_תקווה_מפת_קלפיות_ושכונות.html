function distanceMeters(lat1,lon1,lat2,lon2){
 const R=6371000,toRad=x=>x*Math.PI/180;
 const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
 const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}

 return best;
}

function currentHtmlFilename(){
 try{
   const n=decodeURIComponent(location.pathname.split('/').pop()||'').trim();
   if(n && /\.html?$/i.test(n)) return n;
 }catch(e){}
 return 'מפת_אזורי_צוותים.html';
}
let CURRENT_HTML_FILE_HANDLE=null;

async function writeHtmlToHandle(handle,html){
 const writable=await handle.createWritable();
 await writable.write(new Blob([html],{type:'text/html;charset=utf-8'}));
 await writable.close();
}

async function saveHtmlAs(){
 try{
   const html=buildCurrentHtml();
   if(window.showSaveFilePicker){
     const handle=await window.showSaveFilePicker({
       suggestedName:currentHtmlFilename(),
       types:[{description:'HTML',accept:{'text/html':['.html','.htm']}}]
     });
     await writeHtmlToHandle(handle,html);
     CURRENT_HTML_FILE_HANDLE=handle;
     return true;
   }
   const blob=new Blob([html],{type:'text/html;charset=utf-8'});
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=currentHtmlFilename();
   document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1500);
   alert('הדפדפן אינו מאפשר כתיבה ישירה לקובץ. הקובץ נשמר כהורדה.');
   return false;
 }catch(err){
   if(err && err.name==='AbortError')return false;
   alert('לא ניתן לשמור HTML: '+err.message);
   return false;
 }
}

async function saveHtmlAndRefresh(){
 try{
   const html=buildCurrentHtml();

   if(!window.showSaveFilePicker){
     const blob=new Blob([html],{type:'text/html;charset=utf-8'});
     const url=URL.createObjectURL(blob),a=document.createElement('a');
     a.href=url;a.download=currentHtmlFilename();
     document.body.appendChild(a);a.click();a.remove();
     setTimeout(()=>URL.revokeObjectURL(url),1500);
     alert('הדפדפן אינו מאפשר ל-HTML מקומי לדרוס את עצמו אוטומטית. נשמר קובץ באותו שם כהורדה; ייתכן שהדפדפן יוסיף ‎(1)‎.');
     return;
   }

   if(!CURRENT_HTML_FILE_HANDLE){
     CURRENT_HTML_FILE_HANDLE=await window.showSaveFilePicker({
       suggestedName:currentHtmlFilename(),
       types:[{description:'HTML',accept:{'text/html':['.html','.htm']}}]
     });
   }
   await writeHtmlToHandle(CURRENT_HTML_FILE_HANDLE,html);

   // If the selected target is the currently opened file, reload shows the saved version.
   // Otherwise reload still refreshes the current page; "Save As" is available for intentional copies.
   location.reload();
 }catch(err){
   if(err && err.name==='AbortError')return;
   alert('לא ניתן לשמור HTML: '+err.message);
 }
}

// Backward-compatible function name used by older bindings.
function exportHtmlWithEmbeddedTeams(){ return saveHtmlAndRefresh(); }

function pollExcelRows(){
 const headers=['מזהה מיקום','אזור','שם האזור','שם הקלפי','רחוב','עיר','מספר קלפי','צבע','קו רוחב','קו אורך'];
 const rows=[headers];
 PTS.forEach(p=>{
   const m=META[p.zone]||{};
   rows.push([
     String(p.locationId??''),
     p.zone??'',
     m.name||'',
     p.name||'',
     p.street||'',
     p.city||'',
     String(p.num??''),
     p.color||'',
     p.lat??'',
     p.lon??''
   ]);
 });
 return rows;
}

 if(typeof XLSX==='undefined'){alert('ספריית Excel לא נטענה. נדרש חיבור לאינטרנט.');return}

function loadCombinedExcelBuffer(buffer){
 if(typeof XLSX==='undefined')throw new Error('ספריית Excel לא נטענה. נדרש חיבור לאינטרנט.');
 const wb=XLSX.read(buffer,{type:'array',cellDates:false});
 const pollName=wb.SheetNames.find(n=>String(n).trim()==='קלפיות');
 const teamName=wb.SheetNames.find(n=>String(n).trim()==='ראשי צוותים');
 if(!pollName||!teamName)throw new Error('הקובץ חייב לכלול את הלשוניות "קלפיות" ו-"ראשי צוותים"');

 // Polling sheet
 const prows=XLSX.utils.sheet_to_json(wb.Sheets[pollName],{header:1,defval:'',raw:false});
 if(prows.length<2)throw new Error('לשונית "קלפיות" ריקה');
 const ph=prows[0].map(x=>String(x??'').trim());
 const pidx=(...names)=>{for(const n of names){const i=ph.indexOf(n);if(i>=0)return i}return-1};
 const ii=pidx('מזהה מיקום'),iz=pidx('אזור'),inm=pidx('שם האזור'),ipn=pidx('שם הקלפי'),
       ist=pidx('רחוב'),icity=pidx('עיר'),inum=pidx('מספר קלפי'),icol=pidx('צבע'),
       ilat=pidx('קו רוחב'),ilon=pidx('קו אורך');
 if(iz<0||ipn<0||ilat<0||ilon<0)throw new Error('בלשונית "קלפיות" חסרות עמודות חובה');
 const next=[];
 prows.slice(1).forEach(r=>{
   if(!String(r[iz]??'').trim()&&!String(r[ipn]??'').trim())return;
   const z=Number(String(r[iz]??'').trim());
   const lat=Number(String(r[ilat]??'').replace(',','.')),lon=Number(String(r[ilon]??'').replace(',','.'));
   if(!Number.isFinite(z)||!Number.isFinite(lat)||!Number.isFinite(lon))return;
   next.push({

     street:ist>=0?String(r[ist]??'').trim():'',

 });
 if(!next.length)throw new Error('לא נמצאו קלפיות תקינות');
 localStorage.setItem('pt_polling_points_v1',JSON.stringify(next));
 

 // Team leaders sheet
 const trows=XLSX.utils.sheet_to_json(wb.Sheets[teamName],{header:1,defval:'',raw:false});

 localStorage.setItem('pt_polling_meta_names_v1',JSON.stringify(teamNames));
 // Optional general settings sheet
 const generalName=wb.SheetNames.find(n=>String(n).trim()==='הגדרות כלליות');
 AUTO_LOCATION_ID=false;
 SHOW_CLASSIFICATION=false;
 if(generalName){
   const grows=XLSX.utils.sheet_to_json(wb.Sheets[generalName],{header:1,defval:'',raw:false});
   const settings={};
   grows.slice(1).forEach(r=>{
     const k=String(r[0]??'').trim();

   });
   AUTO_LOCATION_ID=settings['מזהה קלפי מחושב אוטומטי (כן/לא)']==='כן';
   SHOW_CLASSIFICATION=settings['הצגת סיווג']==='כן';
   MAP_HEADER_TITLE=settings['כותרת ראשית']||DEFAULT_HEADER_TITLE;
   MAP_HEADER_SUBTITLE=settings['כותרת משנה']||DEFAULT_HEADER_SUBTITLE;
   localStorage.setItem('pt_map_header_title_v1',MAP_HEADER_TITLE);
   localStorage.setItem('pt_map_header_subtitle_v1',MAP_HEADER_SUBTITLE);
   Object.entries(QUICK_ACTION_FIELDS).forEach(([key,field])=>{QUICK_ACTION_LINKS[key]=validQuickActionUrl(settings[field]||'')});
   localStorage.setItem(QUICK_ACTION_STORAGE,JSON.stringify(QUICK_ACTION_LINKS));
   refreshQuickActions();
   document.getElementById('mapHeaderTitle').textContent=MAP_HEADER_TITLE;
   document.getElementById('mapHeaderSubtitle').textContent=MAP_HEADER_SUBTITLE;
 }

 applyLocationIds(next);
 localStorage.setItem('pt_polling_points_v1',JSON.stringify(next));
 localStorage.setItem(AUTO_LOCATION_ID_KEY,AUTO_LOCATION_ID?'כן':'לא');

 refreshTeamDisplays();
 if(document.getElementById('zoneSearch'))runSearch();
 return {polls:next.length,teams:Object.keys(teams).length};
}

function reportSafeName(v){
 return String(v||'אזור').replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim();
}
function reportDistanceKm(points){
 let max=0;
 for(let i=0;i<points.length;i++)for(let j=i+1;j<points.length;j++)
   max=Math.max(max,distanceMeters(points[i].lat,points[i].lon,points[j].lat,points[j].lon));
 return max/1000;
}
function reportPollingCount(points){
 return points.reduce((sum,p)=>{
   const n=Number(String(p.num??'').replace(/[^\d.]/g,''));
   return sum+(Number.isFinite(n)?n:0);
 },0);
}
function markerWidth(label){
 const n=String(label||'').length;
 return n<=3 ? 24 : (n===4 ? 30 : 36);
}
function markerIcon(label,bg){
 const w=markerWidth(label);
 return L.divIcon({
   className:'',
   html:'<div class="marker-badge" style="width:'+w+'px;background:'+bg+';color:'+markerTextColor(bg)+'">'+label+'</div>',
   iconSize:[w,24],
   iconAnchor:[w/2,12]
 });
}
function reportPollColor(name){
 const key=String(name||'').trim();
 return ORIG[key] || '#ffffff';

function reportPollTextColor(name){
 return markerTextColor(reportPollColor(name));
}

function zoneCenter(z){
 const q=PTS.filter(p=>Number(p.zone)===Number(z));
 if(!q.length)return null;
 return {lat:q.reduce((a,p)=>a+p.lat,0)/q.length,lon:q.reduce((a,p)=>a+p.lon,0)/q.length};
}
function borderingZonesApprox(z){
 const c=zoneCenter(z); if(!c)return [];
 const arr=[];
 for(let k=1;k<=NZ;k++){
   if(k===z)continue;
   const ck=zoneCenter(k); if(!ck)continue;
   let min=Infinity;
   const a=PTS.filter(p=>Number(p.zone)===Number(z)), b2=PTS.filter(p=>p.zone===k);
   a.forEach(p=>b2.forEach(q=>{min=Math.min(min,distanceMeters(p.lat,p.lon,q.lat,q.lon))}));
   arr.push({z:k,d:min});
 }
 arr.sort((a,b)=>a.d-b.d);
 // "Adjacent" is inferred from proximity because the source has no team-zone boundary polygons.
 return arr.slice(0,3).map(x=>x.z);
}
function convexHullLatLng(points){
 const pts=points.map(p=>({x:p.lon,y:p.lat,lat:p.lat,lon:p.lon})).sort((a,b)=>a.x-b.x||a.y-b.y);
 if(pts.length<3)return pts.map(p=>[p.lat,p.lon]);
 const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
 const lo=[]; for(const p of pts){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
 const up=[]; for(let i=pts.length-1;i>=0;i--){const p=pts[i];while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
 lo.pop();up.pop();return lo.concat(up).map(p=>[p.lat,p.lon]);
}

async function waitForMapTiles(timeoutMs=6000){
 const mapEl=document.getElementById('map');
 const started=Date.now();
 // Let Leaflet finish its move/zoom cycle first.
 await new Promise(resolve=>{
   let done=false;
   const finish=()=>{if(done)return;done=true;map.off('moveend',finish);map.off('zoomend',finish);resolve()};
   map.once('moveend',finish);
   map.once('zoomend',finish);
   setTimeout(finish,500);
 });
 // Then wait until every currently visible tile is loaded (or until timeout).
 while(Date.now()-started<timeoutMs){
   const tiles=[...mapEl.querySelectorAll('.leaflet-tile')].filter(t=>{
     const st=getComputedStyle(t);
     return st.display!=='none' && st.visibility!=='hidden';
   });
   const pending=tiles.filter(t=>!t.complete || t.naturalWidth===0);
   if(tiles.length && pending.length===0){
     // Two animation frames + a small paint buffer prevents capturing between tile swaps.
     await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
     await new Promise(r=>setTimeout(r,500));
     return true;
   }
   await new Promise(r=>setTimeout(r,120));
 }
 // Even on slow/failed networks, allow a final paint before capture.
 await new Promise(r=>setTimeout(r,300));
 return false;
}

async function captureZoneMap(z){
 const q=PTS.filter(p=>Number(p.zone)===Number(z));
 const removed=[];
 const mapEl=document.getElementById('map');
 const oldMapStyle={flex:mapEl.style.flex,width:mapEl.style.width,height:mapEl.style.height};
 // Match the report map slot (~2.08:1) before Leaflet calculates bounds and before capture.
 mapEl.style.flex='0 0 1040px';
 mapEl.style.width='1040px';
 mapEl.style.height='500px';
 map.invalidateSize(false);
 const originalIcons={};
 Object.keys(markers).forEach(i=>{
   const idx=Number(i),m=markers[i];
   if(PTS[idx].zone!==z && map.hasLayer(m)){map.removeLayer(m);removed.push(m)}
   else if(PTS[idx].zone===z){
     originalIcons[i]=m.options.icon;
     const p=PTS[idx], col=reportPollColor(p.color);
     m.setIcon(markerIcon(p.locationId,col));
   }
 });
 const neighWas=map.hasLayer(neighborhoodsLayer);
 if(neighWas)map.removeLayer(neighborhoodsLayer);
 const legendEl=neighLegend.getContainer(); if(legendEl)legendEl.style.display='none';
 const layerControls=[...document.querySelectorAll('.leaflet-control-layers')];
 const layerControlDisplays=layerControls.map(el=>el.style.display);
 layerControls.forEach(el=>el.style.display='none');
 const hull=convexHullLatLng(q);
 let hullLayer=null;
 if(hull.length>=3)hullLayer=L.polygon(hull,{color:zcol(z),weight:2,fillColor:zcol(z),fillOpacity:.10,interactive:false}).addTo(map);
 const oldCenter=map.getCenter(),oldZoom=map.getZoom();
 try{
   const bounds=L.latLngBounds(q.map(p=>[p.lat,p.lon]));
   if(bounds.isValid()){
     // Fit ALL team points with a generous safety margin.
     // Do not zoom in again after fitBounds: that was clipping edge points in the report.
     map.fitBounds(bounds,{paddingTopLeft:[70,70],paddingBottomRight:[70,70],maxZoom:16,animate:false});
   }
   // Do not capture until the basemap tiles for this team's new bounds are actually ready.
   await waitForMapTiles(6500);
   const canvas=await html2canvas(document.getElementById('map'),{useCORS:true,allowTaint:false,backgroundColor:'#ffffff',scale:1.6,logging:false});
   const pointPositions=q.map(p=>{
     const pt=map.latLngToContainerPoint([p.lat,p.lon]);
     return {locationId:String(p.locationId),x:pt.x/mapEl.clientWidth,y:pt.y/mapEl.clientHeight,url:wazeUrl(p)};
   });
   return {image:canvas.toDataURL('image/jpeg',0.92),points:pointPositions};
 }finally{
   if(hullLayer)map.removeLayer(hullLayer);
   Object.keys(originalIcons).forEach(i=>{ if(markers[i]) markers[i].setIcon(originalIcons[i]); });
   removed.forEach(m=>m.addTo(map));
   if(neighWas && !neighborhoodMobileQuery.matches)neighborhoodsLayer.addTo(map);
   if(legendEl)legendEl.style.display=neighWas?'':'none';
   layerControls.forEach((el,i)=>el.style.display=layerControlDisplays[i]||'');
   mapEl.style.flex=oldMapStyle.flex;
   mapEl.style.width=oldMapStyle.width;
   mapEl.style.height=oldMapStyle.height;
   map.invalidateSize(false);
   map.setView(oldCenter,oldZoom,{animate:false});
 }
}
// A single canonical numeric zone list, shared by the combined and individual reports.
function reportZoneIds(){
 return [...new Set(PTS.map(p=>Number(p.zone)).filter(z=>Number.isSafeInteger(z)&&z>0))].sort((a,b)=>a-b);
}
// A free-text team name may contain an outdated number. Never present that
// outdated number as the actual team identifier in the PDF.
function reportZoneName(z,rawName){
 const name=String(rawName||'').trim();
 if(!/^[1-9]\d*$/.test(String(z)))return name||String(z);
 const mentions=[...name.matchAll(/צוות\s*([0-9]+)/g)].map(m=>Number(m[1]));
 if(mentions.some(n=>n!==Number(z)))return 'צוות '+z;
 if(!name)return 'צוות '+z;
 if(mentions.length)return name;
 return name+' · צוות '+z;
}

     '<div class="footer">זה הזמן · חוץ קלפי · '+esc('גזרה '+z+(mm.name?' · '+mm.name:''))+'</div></div>';
   await new Promise(r=>setTimeout(r,150));
   const report=document.getElementById('pdfReport');
   const reportRect=report.getBoundingClientRect();
   const teamsSection=report.querySelector('.all-teams-page');
   const teamsRect=teamsSection?teamsSection.getBoundingClientRect():null;
   const splitCssY=teamsRect?(teamsRect.top-reportRect.top):null;

   const pdfLinks=[...report.querySelectorAll('a.pdf-waze-link, .pdf-report a.wa-icon')].map(a=>{
     const r=a.getBoundingClientRect();
     return {url:a.href,x:r.left-reportRect.left,y:r.top-reportRect.top,w:r.width,h:r.height};
   });
   const canvas=await html2canvas(report,{backgroundColor:'#fff',scale:2,logging:false});
   const {jsPDF}=window.jspdf;
   const pdf=options.combinedPdf || new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
   const basePageIndex=options.combinedPdf ? pdf.getNumberOfPages() : 0;
   if(options.combinedPdf) pdf.addPage();
   const pw=210,ph=297,pxPerMm=canvas.width/pw;
   const cssToCanvas=canvas.width/reportRect.width;
   const splitPx=(splitCssY==null)?canvas.height:Math.max(0,Math.min(canvas.height,Math.round(splitCssY*cssToCanvas)));

   function addCanvasRange(y0,y1,forceNewPage){
     if(y1<=y0)return;
     const pagePx=Math.floor(ph*pxPerMm);
     let y=y0,first=true;
     while(y<y1){
       if(forceNewPage || !first || pdf.__hasContent) pdf.addPage();
       const h=Math.min(pagePx,y1-y);
       const c=document.createElement('canvas');c.width=canvas.width;c.height=h;
       c.getContext('2d').drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);
       pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,pw,h/pxPerMm,'','FAST');
       pdf.__hasContent=true;
       y+=h; first=false; forceNewPage=false;
     }
   }

   // Part 1: zone report. It may use several pages.
   if(options.combinedPdf) pdf.__hasContent=false;
   addCanvasRange(0,splitPx,false);
   // Part 2: all teams ALWAYS starts on a fresh PDF page.
   if(splitPx<canvas.height)addCanvasRange(splitPx,canvas.height,true);

   // Add Google Maps annotations using the same explicit page split.
   const cssPxPerMm=reportRect.width/pw;
   const splitMm=(splitCssY==null)?Infinity:splitCssY/cssPxPerMm;
   const firstPages=Math.max(1,Math.ceil((splitPx/pxPerMm)/ph));
   pdfLinks.forEach(l=>{
     const x=l.x/cssPxPerMm,w=l.w/cssPxPerMm,h=l.h/cssPxPerMm;
     const yMm=l.y/cssPxPerMm;
     let localPageIndex,absolutePageIndex,localY;
     if(yMm<splitMm){
       // Keep the page number inside this zone separate from its absolute
       // page number in the combined PDF. Using the absolute index here
       // previously pushed link rectangles far above the page.
       localPageIndex=Math.floor(yMm/ph);
       absolutePageIndex=basePageIndex+localPageIndex;
       localY=yMm-localPageIndex*ph;
     }else{
       const rel=yMm-splitMm;
       localPageIndex=Math.floor(rel/ph);
       absolutePageIndex=basePageIndex+firstPages+localPageIndex;
       localY=rel-localPageIndex*ph;
     }
     if(absolutePageIndex>=0 && absolutePageIndex<pdf.getNumberOfPages()){
       pdf.setPage(absolutePageIndex+1);
       pdf.link(x,localY,w,h,{url:l.url});
     }
   });
   if(!options.combined) pdf.save(reportSafeName((mm.name||('אזור_'+z))+(team.leader1?' - '+team.leader1:''))+'.pdf');
   return options.combined ? pdf : true;
 }catch(err){
   if(!window.__batchPdfMode) alert('לא ניתן להפיק PDF: '+err.message);
   return false;
 }finally{
   if(btn){btn.disabled=false;btn.textContent=oldText}
 }
}



async function generateCombinedZonePdf(){
 const btn=document.getElementById('generateCombinedReport');
 const status=document.getElementById('combinedExcelStatus');
 if(!btn)return;
 const zones=reportZoneIds();
 if(!zones.length){if(status)status.textContent='לא נמצאו צוותים עם מיקומי קלפי.';return}
 if(typeof window.jspdf==='undefined'){if(status)status.textContent='ספריית PDF לא נטענה.';return}
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
 const original=btn.textContent;
 btn.disabled=true;
 window.__batchPdfMode=true;
 try{
   for(let i=0;i<zones.length;i++){
     const z=zones[i];
     btn.textContent='מפיק '+(i+1)+'/'+zones.length+'…';
     if(status)status.textContent='מוסיף לדוח המאוחד את צוות '+z+' ('+(i+1)+' מתוך '+zones.length+')…';
     const result=await generateZonePdf(z,{
       combined:true,
       combinedPdf:pdf,
       includeAllTeams:i===zones.length-1
     });
     if(!result) throw new Error('הפקת דוח צוות '+z+' נכשלה');
     await new Promise(r=>setTimeout(r,250));
   }
   // Remove the initial blank page that exists because each zone starts on a fresh page.
   if(pdf.getNumberOfPages()>1){
     pdf.deletePage(1);
   }
   pdf.save('כלל הצוותים - דוח מאוחד.pdf');
   if(status)status.textContent='הושלם PDF מאוחד עבור '+zones.length+' צוותים. רשימת כלל הצוותים מופיעה פעם אחת בסוף.';
 }catch(err){
   if(status)status.textContent='שגיאה בהפקת הדוח המאוחד: '+err.message;
 }finally{
   window.__batchPdfMode=false;
   btn.disabled=false;
   btn.textContent=original;
 }
}

async function generateAllZonePdfs(){
 const btn=document.getElementById('generateAllReports');
 const status=document.getElementById('combinedExcelStatus');
 if(!btn)return;
 const zones=reportZoneIds();
 if(!zones.length){if(status)status.textContent='לא נמצאו צוותים עם מיקומי קלפי.';return}
 const original=btn.textContent;
 btn.disabled=true;
 window.__batchPdfMode=true;
 let ok=0,failed=[];
 try{
   for(let i=0;i<zones.length;i++){
     const z=zones[i];
     btn.textContent='מפיק '+(i+1)+'/'+zones.length+'…';
     if(status)status.textContent='מפיק דוח לצוות '+z+' ('+(i+1)+' מתוך '+zones.length+')…';
     const success=await generateZonePdf(z);
     if(success)ok++; else failed.push(z);
     // Give the browser a short pause between downloads/renders.
     await new Promise(r=>setTimeout(r,500));
   }
   if(status)status.textContent=failed.length
     ? 'הופקו '+ok+' דוחות. נכשלו צוותים: '+failed.join(', ')+'.'
     : 'הושלמה הפקת '+ok+' דוחות PDF.';
 }finally{
   window.__batchPdfMode=false;
   btn.disabled=false;
   btn.textContent=original;
 }
}

const ZONE_BLOCKS={};
function neighborhoodNamesForPoint(p){
 const names=[];
 neighborhoodsLayer.eachLayer(layer=>{
   const f=layer.feature;
   if(!f||!f.properties||!f.properties.name)return;
   try{
     const ll=L.latLng(p.lat,p.lon);
     const bounds=layer.getBounds&&layer.getBounds();
     if(bounds&&bounds.contains(ll)) names.push(f.properties.name);
   }catch(e){}
 });
 return names;
}
PTS.forEach(p=>{p._neighborhoods=neighborhoodNamesForPoint(p)});

for(const z of allTeamZoneIds()){const col=zcol(z),mm=metaFor(z);
 const blk=document.createElement('div');blk.className='zone-block';blk.dataset.zone=z;
 const hd=document.createElement('div');hd.className='zone-hd';hd.style.background=col;setZoneHeaderContrast(hd,col);
 const t=(mm.min?esc(String(mm.min))+' דק׳':'')+(mm.km?(mm.min?' · ':'')+esc(String(mm.km))+' ק״מ':'');
 const zonePoints=PTS.filter(p=>String(p.zone)===String(z));
 const actualLocations=zonePoints.length;
 const actualPolls=reportPollingCount(zonePoints);
 hd.innerHTML='<div class="r1"><span>'+(/^[1-9]\d*$/.test(String(z))?'אזור ':'צוות מרחבי · ')+esc(String(z))+(mm.name&&mm.name!==String(z)?' · '+esc(mm.name):'')+'</span><span>'+t+'</span></div><div class="r2">'+(actualLocations?actualLocations+' מיקומים · '+actualPolls+' קלפיות':'צוות מרחבי · ללא גזרה וקלפיות')+'</div><div class="zone-comm" data-zone-comm="'+z+'">'+commHtml(z)+'</div>';
 const teamBox=document.createElement('div');teamBox.dataset.teamZone=z;teamBox.innerHTML=teamHtml(z,false);hd.appendChild(teamBox);
 if(zonePoints.length){const reportBtn=document.createElement('button');reportBtn.className='zone-report-btn';reportBtn.dataset.reportZone=z;reportBtn.textContent='הפק דוח PDF';
 reportBtn.onclick=e=>{e.stopPropagation();generateZonePdf(z)};hd.appendChild(reportBtn);}
 const ul=document.createElement('ul');
 PTS.forEach((p,i)=>{if(String(p.zone)!==String(z))return;
  const li=document.createElement('li');li.dataset.pointIndex=i;
  li.innerHTML='<b class="location-id">'+esc(p.locationId)+'</b> · '+('<span class="dot" style="background:'+(ORIG[p.color]||'#ccc')+'"></span> <span class="nm">'+esc(p.name)+'</span> '+pointNavLink(p)+'<br><span class="ad">'+esc(p.street)+' · '+esc(p.city)+' · '+p.num+'</span>');
  li.onclick=e=>{if(e.target.closest('a'))return;e.stopPropagation();map.setView([p.lat,p.lon],17);markers[i].openPopup();closeMobileDrawer()};
  ul.appendChild(li);
 });
 hd.onclick=e=>{
   if(e.target.closest('a'))return;
   blk.classList.toggle('open');
   if(blk.classList.contains('open')){const q=zonePoints.map(p=>[p.lat,p.lon]);if(q.length)map.fitBounds(q,{padding:[60,60]});}
 };
 blk.appendChild(hd);blk.appendChild(ul);listEl.appendChild(blk);ZONE_BLOCKS[z]=blk;
}

refreshTeamColors();
function setAllZones(open){Object.values(ZONE_BLOCKS).forEach(b=>b.classList.toggle('open',open))}
document.getElementById('expandAll').onclick=()=>setAllZones(true);
document.getElementById('collapseAll').onclick=()=>setAllZones(false);

function norm(v){return String(v||'').toLowerCase().trim()}
function runSearch(){
 const q=norm(document.getElementById('zoneSearch').value),summary=document.getElementById('searchSummary');
 if(!q){Object.values(ZONE_BLOCKS).forEach(b=>{b.style.display='';b.classList.remove('open')});document.querySelectorAll('#list li').forEach(li=>{li.style.display='';li.classList.remove('search-hit')});summary.textContent='';return}
 let zonesShown=0,pointsShown=0;
 for(const z of allTeamZoneIds()){
   const blk=ZONE_BLOCKS[z],mm=metaFor(z),team=teamFor(z);
   const zoneText=norm(['אזור '+z,'צוות מרחבי',mm.name,...teamPeople(z).flatMap(p=>[p.name,p.phone]),team.network,team.groupUrl,team.space].join(' '));
   const zoneMatch=zoneText.includes(q);let pointMatches=0;
   blk.querySelectorAll('li').forEach(li=>{
     const p=PTS[Number(li.dataset.pointIndex)];
     const pointText=norm([p.locationId,p.name,p.street,p.city,p.num,(p._neighborhoods||[]).join(' ')].join(' '));
     const hit=zoneMatch||pointText.includes(q);
     li.style.display=hit?'':'none';li.classList.toggle('search-hit',hit&&!zoneMatch);
     if(hit){pointMatches++;pointsShown++}
   });
   const show=zoneMatch||pointMatches>0;blk.style.display=show?'':'none';blk.classList.toggle('open',show);
   if(show)zonesShown++;
 }
 summary.textContent=zonesShown+' אזורים · '+pointsShown+' קלפיות מתאימות';
}
document.getElementById('zoneSearch').addEventListener('input',runSearch);
document.getElementById('searchClear').onclick=()=>{document.getElementById('zoneSearch').value='';runSearch();document.getElementById('zoneSearch').focus()};

refreshTeamDisplays();
